# ========================================
# GKI 内核构建主入口
# ========================================
# 此工作流是项目的统一入口点，用于：
# 1. 构建所有版本的 GKI 内核（NyaSU / None）
# 2. 收集补丁冲突文件用于调试
# 3. 创建 GitHub Release (可选)
# ========================================

name: 构建内核

# 并发控制：同一分支只运行一个实例，新运行会取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 发布配置 ====================
      release_type:
        description: "发布类型"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      # ==================== KernelSU 配置 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        type: choice
        options:
          - NyaSU
          - None
        default: NyaSU
      kernelsu_branch:
        description: "KSU 分支"
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Latest(最新)
        default: Stable(标准)

      # ==================== 可选配置 ====================
      version:
        description: "自定义版本名 (可选)"
        type: string
        default: ""
        required: false
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
        required: false
      # ==================== 虚拟化支持配置 ====================
      virtualization_support:
        description: "虚拟化支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)"
        type: choice
        options:
          - "off"
          - "on"
          - "678"
          - "123"
          - "345"
        default: "off"

      # ==================== 功能开关 ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        type: boolean
        default: false
      use_ddk:
        description: "启用 DDK 防格机 LSM"
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（IPSet + BBR）"
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        type: boolean
        default: false
      # ==================== ZRAM 扩展选项 ====================
      zram_full_algo:
        description: "启用 ZRAM 完整算法支持（6.12 自动跳过 legacy LZ4K/LZ4KD/LZ4K_OPLUS）"
        type: boolean
        default: false
      zram_extra_algos:
        description: "自定义 ZRAM 算法（逗号分隔，如 lzo,lz4,deflate,zstd；6.12 会忽略 lz4k/lz4kd/lz4k_oplus）"
        type: string
        default: ""
        required: false

      custom_kernel_options:
        description: "自定义内核选项（每行一条 Kconfig/defconfig 片段）"
        required: false
        type: string
        default: ""


      # ==================== 构建版本选择 ====================
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false

      build_all:
        description: "构建全部版本（忽略上方单独版本选项）"
        type: boolean
        default: true

jobs:
  # ==================== Android 12 - 5.10 构建 ====================
  build-a12-5-10:
    if: inputs.build_a12_5_10 || inputs.build_all
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_rekernel: ${{ inputs.use_rekernel }}
      virtualization_support: ${{ inputs.virtualization_support }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ${{ inputs.zram_extra_algos || '' }}
      custom_external_modules: ${{ inputs.custom_external_modules || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}

  # ==================== Android 13 - 5.15 构建 ====================
  build-a13-5-15:
    if: inputs.build_a13_5_15 || inputs.build_all
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_rekernel: ${{ inputs.use_rekernel }}
      virtualization_support: ${{ inputs.virtualization_support }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ${{ inputs.zram_extra_algos || '' }}
      custom_external_modules: ${{ inputs.custom_external_modules || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}

  # ==================== Android 14 - 6.1 构建 ====================
  build-a14-6-1:
    if: inputs.build_a14_6_1 || inputs.build_all
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_rekernel: ${{ inputs.use_rekernel }}
      virtualization_support: ${{ inputs.virtualization_support }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ${{ inputs.zram_extra_algos || '' }}
      custom_external_modules: ${{ inputs.custom_external_modules || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}

  # ==================== Android 15 - 6.6 构建 ====================
  build-a15-6-6:
    if: inputs.build_a15_6_6 || inputs.build_all
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_rekernel: ${{ inputs.use_rekernel }}
      virtualization_support: ${{ inputs.virtualization_support }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ${{ inputs.zram_extra_algos || '' }}
      custom_external_modules: ${{ inputs.custom_external_modules || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}

  # ==================== Android 16 - 6.12 构建 ====================
  build-a16-6-12:
    if: inputs.build_a16_6_12 || inputs.build_all
    uses: ./.github/workflows/kernel-a16-6-12.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_rekernel: ${{ inputs.use_rekernel }}
      virtualization_support: ${{ inputs.virtualization_support }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ${{ inputs.zram_extra_algos || '' }}
      custom_external_modules: ${{ inputs.custom_external_modules || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}

  # ==================== Android 17 - 6.18 构建 ====================
  build-a17-6-18:
    if: inputs.build_all
    uses: ./.github/workflows/kernel-a17-6-18.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: false
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_rekernel: ${{ inputs.use_rekernel }}
      virtualization_support: ${{ inputs.virtualization_support }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ${{ inputs.zram_extra_algos || '' }}
      custom_external_modules: ${{ inputs.custom_external_modules || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}

  # ==================== 收集补丁冲突文件 ====================
  # 汇总所有构建任务中的 .rej 文件，方便调试补丁问题
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - build-a17-6-18
    steps:
      - name: 下载冲突文件
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: 处理冲突文件
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: 上传汇总冲突文件
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # ==================== 创建发布 ====================
  # 当 release_type 不是 Actions 时，创建 GitHub Release
  # 仅限原仓库运行，fork 仓库跳过此步骤
  release:
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' && github.repository == 'xingguangcuican6666/ABK' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - build-a17-6-18

    # ==================== 环境变量 ====================
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ==================== 设置显示名称 ====================
      # 预计算各种显示名称，简化后续引用
      - name: 设置显示名称
        run: |
          # 变体显示名称：编译链只剩 NyaSU 与 None（不集成 Root）两条路径
          case "${{ inputs.kernelsu_variant }}" in
            "NyaSU")  KSU_NAME="NyaSU" ;;
            "None")   KSU_NAME="None" ;;
            *) echo "::error::未知 KSU 变体: ${{ inputs.kernelsu_variant }}" >&2; exit 1 ;;
          esac
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV

          # 功能开关显示
          echo "LZ4_STATUS=${{ inputs.use_zram && '开启' || '未开启' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && '支持' || '不支持' }}" >> $GITHUB_ENV

          # 分支显示
          case "${{ inputs.kernelsu_branch }}" in
            "Dev(开发)") BRANCH_INFO="Dev" ;;
            "Latest(最新)") BRANCH_INFO="Latest" ;;
            *) BRANCH_INFO="Stable" ;;
          esac
          echo "BRANCH_INFO=$BRANCH_INFO" >> $GITHUB_ENV


      # ==================== 验证构建状态 ====================
      # 确保所有选中的构建任务都成功完成
      - name: 验证构建状态
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "选中的构建任务 $job_name 失败 (结果: $result)"
              failed=1
            fi
          }
          check_build "${{ inputs.build_a12_5_10 || inputs.build_all }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ inputs.build_a13_5_15 || inputs.build_all }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ inputs.build_a14_6_1 || inputs.build_all }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ inputs.build_a15_6_6 || inputs.build_all }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ inputs.build_a16_6_12 || inputs.build_all }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          check_build "${{ inputs.build_all }}" "build-a17-6-18" "${{ needs.build-a17-6-18.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      # ==================== 检出代码 ====================
      - name: 检出代码
        uses: actions/checkout@v6

      # ==================== 获取 NyaSU 提交信息 ====================
      # NyaSU 的 Stable / Dev 是静态钉版，Latest 追踪 main HEAD（与 resolve-ksu-ref.sh 一致）。
      - name: 获取 NyaSU 提交信息
        run: |
          NYASU_REPO_URL="xingguangcuican6666/NyaSU"
          # 与 .github/scripts/resolve-ksu-ref.sh 的 NYASU_STABLE_REF / NYASU_DEV_REF 保持一致。
          NYASU_STABLE_REF="c6473f97ff516f2b3184b6a2d63753c8591a8edb"
          NYASU_DEV_REF="c6473f97ff516f2b3184b6a2d63753c8591a8edb"

          case "${{ inputs.kernelsu_branch }}" in
            "Stable(标准)") KSU_REF="$NYASU_STABLE_REF" ;;
            "Dev(开发)")    KSU_REF="$NYASU_DEV_REF" ;;
            "Latest(最新)")
              KSU_REF="$(git ls-remote "https://github.com/${NYASU_REPO_URL}.git" refs/heads/main | awk '{ print $1 }')"
              ;;
            *) echo "::error::未知 KSU 分支: ${{ inputs.kernelsu_branch }}" >&2; exit 1 ;;
          esac
          if [[ ! "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::NyaSU 提交解析失败: '${KSU_REF}'" >&2
            exit 1
          fi
          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=https://github.com/${NYASU_REPO_URL}/commit/${KSU_REF}" >> $GITHUB_ENV
          if [ "$KSU_NAME" = "NyaSU" ]; then
            echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${BRANCH_INFO} (${KSU_REF:0:7})" >> $GITHUB_ENV
          else
            echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${BRANCH_INFO}" >> $GITHUB_ENV
          fi
          echo "NyaSU 提交: ${KSU_REF}"

      # ==================== 生成发布说明 ====================
      # 创建包含详细信息的发布说明文档
      - name: 生成发布说明
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            KSU_DISPLAY_REF="${KSU_REF:0:7}"
          else
            KSU_DISPLAY_REF="$KSU_REF"
          fi

          build_targets=""
          append_target() {
            local selected="$1" label="$2"
            if [[ "$selected" == "true" ]]; then
              if [[ -z "$build_targets" ]]; then
                build_targets="$label"
              else
                build_targets="$build_targets, $label"
              fi
            fi
          }
          append_target "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10"
          append_target "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15"
          append_target "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1"
          append_target "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6"
          append_target "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12"
          append_target "${{ inputs.build_all }}" "Android 17 / 6.18"
          if [[ -z "$build_targets" ]]; then
            build_targets="未选择"
          fi

          cat > release_body.md << EOF
          ## GKI Kernel Release

          **$KSU_NAME** \`$KSU_DISPLAY_REF\`

          | 项目 | 内容 |
          |:---|:---|
          | 发布类型 | ${{ inputs.release_type }} |
          | 发布时间 | $BUILD_DATE |
          | 构建范围 | $build_targets |

          ### 构建配置

          | 项目 | 内容 |
          |:---|:---|
          | KernelSU 变体 | $KSU_NAME |
          | KernelSU 分支 | $BRANCH_INFO |
          | LTO | thin |
          | BBG 安全补丁 | $BBG_STATUS |
          | ZRAM / LZ4KD | $LZ4_STATUS |

          ### 下载说明

          请在下方 **Assets** 中下载对应文件。

          | 文件类型 | 用途 |
          |:---|:---|
          | \`*.bundle.zip\` | 已签名的 AnyKernel3 / boot 镜像刷入包 |
          ---

          > [!IMPORTANT]
          > 刷入前请备份原厂 Boot 镜像。
          > 如果设备无法启动，请先恢复原厂镜像，再提取内核日志反馈。

          <details>
          <summary>刷入后处理</summary>

          ### 正常启动

          安装 ABK App（NyaSU 构建的管理器就是 ABK 自身 App），检查 root 与模块状态是否正常。

          ### 无法启动

          1. 恢复原厂 Boot 镜像
          2. 通过 ABK App 或 recovery 提取内核日志
          3. 将日志提交到 [Issues](https://github.com/xingguangcuican6666/ABK/issues)，并附上设备型号、Android 版本、内核版本和刷入文件名

          1. Restore stock boot image
          2. Extract kernel logs with the ABK app or recovery
          3. Submit logs to [Issues](https://github.com/xingguangcuican6666/ABK/issues) or consult experts

          </details>

          <details>
          <summary>上游提交信息</summary>

          **NyaSU**

          - NyaSU: [\`$KSU_DISPLAY_REF\`]($KSU_URL)

          </details>
          EOF

      # ==================== 生成版本标签 ====================
      # 标签以构建日期 + 变体为前缀（不再依赖 SUSFS 版本），同日多次发布递增 -rN。
      - name: 生成版本标签
        run: |
          TAG_PREFIX="$(date -u '+%Y.%m.%d')-${KSU_NAME}"
          LATEST_TAG="$(gh api "repos/$REPO_OWNER/$REPO_NAME/git/matching-refs/tags/${TAG_PREFIX}-r" \
            --jq '.[].ref | sub("refs/tags/"; "")' 2>/dev/null | sort -V | tail -n1 || true)"
          if [[ "$LATEST_TAG" =~ -r([0-9]+)$ ]]; then
            REVISION=$(( BASH_REMATCH[1] + 1 ))
          else
            REVISION=0
          fi
          NEW_TAG="${TAG_PREFIX}-r${REVISION}"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

          git tag "$NEW_TAG"
          git push origin "refs/tags/$NEW_TAG"

      # ==================== 下载构建产物 ====================
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      # ==================== 创建 GitHub Release ====================
      - name: 创建 GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$NEW_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release_body.md \
            $PRERELEASE_FLAG

      - name: 准备 Release 合规包
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("downloaded-artifacts")
          kernel_assets = []

          for file in sorted(root.rglob("*")):
              if not file.is_file():
                  continue
              rel = file.relative_to(root)
              if "-Rejects/" in rel.as_posix():
                  continue
              top = rel.parts[0] if rel.parts else ""
              if "_kernel-" in top and file.name.endswith(".bundle.zip"):
                  kernel_assets.append(str(file))

          Path("release-kernel-bundles.txt").write_text(
              "".join(f"{path}\n" for path in kernel_assets),
              encoding="utf-8"
          )
          PY

      # ==================== 上传内核产物 ====================
      - name: 上传内核产物
        run: |
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            echo "上传 $file..."
            gh release upload "$NEW_TAG" "$file"
          done < release-kernel-bundles.txt

      # ==================== 构建摘要 ====================
      - name: 构建摘要
        run: |
          echo "## 发布已创建" >> $GITHUB_STEP_SUMMARY
          echo "- **标签**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **类型**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **链接**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY

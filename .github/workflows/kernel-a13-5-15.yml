name: 内核构建 - Android 13 (5.15)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - ReSukiSU
        default: ReSukiSU
      kernelsu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)
      sub_levels:
        description: '要构建的小版本 (用逗号分隔，例如: 74,94,149,X)'
        required: true
        default: '149,167,X'
        type: string
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        required: true
        type: boolean
        default: true
      use_networking:
        description: "启用 Networking增强"
        required: true
        type: boolean
        default: true
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_ntsync:
        required: true
        type: boolean
      use_networking:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 生成构建矩阵
        id: set-matrix
        run: |
          # 定义版本映射表
          declare -A patch_map=(
            ["74"]="2023-01"
            ["78"]="2023-03"
            ["94"]="2023-05"
            ["104"]="2023-07"
            ["119"]="2023-09"
            ["123"]="2023-11"
            ["137"]="2024-01"
            ["144"]="2024-03"
            ["148"]="2024-05"
            ["149"]="2024-07"
            ["151"]="2024-08"
            ["153"]="2024-09"
            ["167"]="2024-11"
            ["170"]="2025-01"
            ["178"]="2025-03"
            ["180"]="2025-05"
            ["185"]="2025-07"
            ["189"]="2025-09"
            ["194"]="2025-12"
            ["X"]="lts"
          )

          IFS=',' read -ra selected <<< "${{ inputs.sub_levels }}"
          items=()

          for ver in "${selected[@]}"; do
            ver=$(echo "$ver" | tr -d ' ')  # 去除空格
            if [[ -n "${patch_map[$ver]}" ]]; then
              patch="${patch_map[$ver]}"
              items+=("{\"sub_level\":\"$ver\",\"os_patch_level\":\"$patch\"}")
            else
              echo "⚠️ 未知版本: $ver，已跳过"
            fi
          done

          if [ ${#items[@]} -eq 0 ]; then
            echo "❌ 没有有效的版本被选中！"
            exit 1
          fi

          matrix=$(jq -n --argjson arr "[${items[*]}]" '{include: $arr}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "将构建以下版本：${items[*]}"
  build-kernels-a13-5-15:
    name: "5.15.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android13"
      kernel_version: "5.15"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ntsync: ${{ inputs.use_ntsync }}
      use_networking: ${{ inputs.use_networking }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

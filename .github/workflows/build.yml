name: 内核构建流程

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      source_mode:
        required: false
        type: string
        default: "aosp"
      source_repo:
        required: false
        type: string
        default: ""
      source_ref:
        required: false
        type: string
        default: ""
      source_private:
        required: false
        type: boolean
        default: false
      source_commit:
        required: false
        type: string
        default: ""
      source_defconfigs:
        required: false
        type: string
        default: ""
      source_device_label:
        required: false
        type: string
        default: ""
      kernel_version_override:
        required: false
        type: string
        default: ""
      source_kernel_version:
        required: false
        type: string
        default: ""
      source_full_kernel_version:
        required: false
        type: string
        default: ""
      source_android_version:
        required: false
        type: string
        default: ""
      # ==================== 基础配置 ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU 配置 ====================
      ksu_variant:
        required: true
        type: string
      ksu_branch:
        required: true
        type: string

      # ==================== 可选配置 ====================
      custom_ref:
        required: false
        type: string
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 功能开关 ====================
      use_zram:
        required: false
        type: boolean
        default: true
      use_bbg:
        required: false
        type: boolean
        default: true
      use_ddk:
        required: false
        type: boolean
        default: false
      use_ntsync:
        required: false
        type: boolean
        default: true
      use_networking:
        required: false
        type: boolean
        default: true
      use_kpm:
        required: false
        type: boolean
        default: true
      use_rekernel:
        required: false
        type: boolean
        default: false
      enable_susfs:
        required: false
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
        default: false
      virtualization_support:
        required: false
        type: string
        default: "off"

      # ==================== ZRAM 扩展选项 ====================
      zram_full_algo:
        required: false
        type: boolean
        default: false
      zram_extra_algos:
        required: false
        type: string
        default: ""

      # ==================== KPM 扩展选项 ====================
      kpm_password:
        required: false
        type: string
        default: ""

      # ==================== 自定义外部模块 ====================
      custom_external_modules:
        required: false
        type: string
        default: ""
      custom_kernel_options:
        required: false
        type: string
        default: ""
      manager_package:
        required: false
        type: string
        default: ""
      manager_cert_size:
        required: false
        type: string
        default: ""
      manager_cert_sha256:
        required: false
        type: string
        default: ""
      upload_aux_artifacts:
        required: false
        type: boolean
        default: true

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ${{ vars.KERNEL_SELF_HOSTED == 'false' && 'ubuntu-latest' || (startsWith(vars.KERNEL_RUNNER, '[') && fromJSON(vars.KERNEL_RUNNER) || vars.KERNEL_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 60

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v6

      - name: 构建信息摘要
        shell: bash
        env:
          ABK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          USE_ZRAM: ${{ inputs.use_zram }}
          USE_BBG: ${{ inputs.use_bbg }}
          USE_DDK: ${{ inputs.use_ddk }}
          USE_NTSYNC: ${{ inputs.use_ntsync }}
          USE_NETWORKING: ${{ inputs.use_networking }}
          USE_KPM: ${{ inputs.use_kpm }}
          USE_REKERNEL: ${{ inputs.use_rekernel }}
          VIRTUALIZATION_SUPPORT: ${{ inputs.virtualization_support }}
          ABK_INPUT_SOURCE_MODE: ${{ inputs.source_mode }}
          ABK_INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
          ABK_INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          ABK_INPUT_SOURCE_PRIVATE: ${{ inputs.source_private }}
          ABK_INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          ABK_INPUT_SOURCE_DEFCONFIGS: ${{ inputs.source_defconfigs }}
          ABK_INPUT_SOURCE_DEVICE_LABEL: ${{ inputs.source_device_label }}
          ABK_INPUT_KERNEL_VERSION_OVERRIDE: ${{ inputs.kernel_version_override }}
          ABK_INPUT_SOURCE_FULL_KERNEL_VERSION: ${{ inputs.source_full_kernel_version }}
          ABK_INPUT_SOURCE_ANDROID_VERSION: ${{ inputs.source_android_version }}
          ABK_INPUT_ANDROID_VERSION: ${{ inputs.android_version }}
          ABK_INPUT_KERNEL_VERSION: ${{ inputs.kernel_version }}
          ABK_INPUT_SUB_LEVEL: ${{ inputs.sub_level }}
          ABK_INPUT_OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          ABK_INPUT_KSU_VARIANT: ${{ inputs.ksu_variant }}
          ABK_INPUT_KSU_BRANCH: ${{ inputs.ksu_branch }}
          ABK_INPUT_CUSTOM_REF: ${{ inputs.custom_ref }}
          ABK_INPUT_VERSION: ${{ inputs.version }}
          ABK_INPUT_REVISION: ${{ inputs.revision }}
          ABK_INPUT_BUILD_TIME: ${{ inputs.build_time }}
          ABK_INPUT_USE_ZRAM: ${{ inputs.use_zram }}
          ABK_INPUT_USE_BBG: ${{ inputs.use_bbg }}
          ABK_INPUT_USE_DDK: ${{ inputs.use_ddk }}
          ABK_INPUT_USE_NTSYNC: ${{ inputs.use_ntsync }}
          ABK_INPUT_USE_NETWORKING: ${{ inputs.use_networking }}
          ABK_INPUT_USE_KPM: ${{ inputs.use_kpm }}
          ABK_INPUT_USE_REKERNEL: ${{ inputs.use_rekernel }}
          ABK_INPUT_ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ABK_INPUT_SUPP_OP: ${{ inputs.supp_op }}
          ABK_INPUT_VIRTUALIZATION_SUPPORT: ${{ inputs.virtualization_support }}
          ABK_INPUT_ZRAM_FULL_ALGO: ${{ inputs.zram_full_algo }}
          ABK_INPUT_ZRAM_EXTRA_ALGOS: ${{ inputs.zram_extra_algos }}
          ABK_INPUT_KPM_PASSWORD: ${{ inputs.kpm_password }}
          ABK_INPUT_CUSTOM_EXTERNAL_MODULES: ${{ inputs.custom_external_modules }}
          ABK_INPUT_CUSTOM_KERNEL_OPTIONS: ${{ inputs.custom_kernel_options }}
          ABK_INPUT_MANAGER_PACKAGE: ${{ inputs.manager_package }}
          ABK_INPUT_MANAGER_CERT_SIZE: ${{ inputs.manager_cert_size }}
          ABK_INPUT_MANAGER_CERT_SHA256: ${{ inputs.manager_cert_sha256 }}
          ABK_INPUT_UPLOAD_AUX_ARTIFACTS: ${{ inputs.upload_aux_artifacts }}
        run: bash platform-tools/kernel_build/clean/env.sh summary

      - name: 校验自定义内核版本组合
        if: inputs.source_mode != 'custom_git'
        shell: bash
        run: bash platform-tools/kernel_build/clean/validate.sh validate

      - name: 清理磁盘空间
        if: runner.environment == 'github-hosted'
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: 校验类 LineageOS 源码构建参数
        if: inputs.source_mode == 'custom_git'
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_PRIVATE: ${{ inputs.source_private }}
          SOURCE_DEFCONFIGS: ${{ inputs.source_defconfigs }}
          SOURCE_DEVICE_LABEL: ${{ inputs.source_device_label }}
          SOURCE_KERNEL_VERSION: ${{ inputs.source_kernel_version }}
          SOURCE_ANDROID_VERSION: ${{ inputs.source_android_version }}
          SOURCE_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: bash platform-tools/kernel_build/clean/source.sh validate-custom

      - name: 确定 KernelSU 分支
        if: inputs.ksu_variant != 'None'
        id: ksu-branch
        env:
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
          CUSTOM_REF: ${{ inputs.custom_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash platform-tools/kernel_build/patch/kernelsu.sh resolve-ref

      - name: 准备 ABK 管理器证书元数据
        shell: bash
        run: bash platform-tools/kernel_build/clean/env.sh manager-cert

      - name: 初始化构建环境
        run: bash platform-tools/kernel_build/clean/env.sh init

      - name: 显示配置信息
        run: bash platform-tools/kernel_build/clean/env.sh show

      - name: 安装编译依赖
        run: bash platform-tools/kernel_build/clean/toolchain.sh deps-install

      - name: 配置自托管下载缓存
        env:
          ABK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          KERNEL_LOCAL_CACHE: ${{ vars.KERNEL_LOCAL_CACHE || 'auto' }}
          KERNEL_LOCAL_CACHE_DIR: ${{ vars.KERNEL_LOCAL_CACHE_DIR }}
        run: bash platform-tools/kernel_build/clean/toolchain.sh cache-configure

      - name: 配置 ccache
        run: bash platform-tools/kernel_build/clean/toolchain.sh ccache

      - name: 恢复 ccache 缓存
        if: env.ABK_LOCAL_CACHE_ENABLED != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      - name: 缓存工具链
        if: env.ABK_LOCAL_CACHE_ENABLED != 'true'
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      - name: 下载工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: bash platform-tools/kernel_build/clean/toolchain.sh toolchain

      - name: 生成签名密钥
        run: bash platform-tools/kernel_build/clean/toolchain.sh sign-key

      - name: 配置 Git
        run: bash platform-tools/kernel_build/clean/toolchain.sh git-config

      - name: 克隆依赖仓库
        run: bash platform-tools/kernel_build/clean/deps.sh deps-clone

      - name: 克隆自定义外部模块
        if: inputs.custom_external_modules != ''
        env:
          CUSTOM_EXTERNAL_MODULES: ${{ inputs.custom_external_modules }}
        run: bash platform-tools/kernel_build/patch/custom.sh modules-clone

      - name: 生成刷写外层 Magisk 依赖清单
        if: inputs.custom_external_modules != ''
        env:
          ABK_FLASH_DEPENDENCY_MANIFEST: ${{ github.workspace }}/ABK_FLASH_DEPENDENCIES.json
        run: bash platform-tools/kernel_build/patch/custom.sh flash-deps

      - name: 初始化并同步内核源码
        env:
          ABK_CUSTOM_SOURCE_GITHUB_TOKEN: ${{ secrets.ABK_CUSTOM_SOURCE_GITHUB_TOKEN }}
          SOURCE_MODE: ${{ inputs.source_mode }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_PRIVATE: ${{ inputs.source_private }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_DEFCONFIGS: ${{ inputs.source_defconfigs }}
          SOURCE_DEVICE_LABEL: ${{ inputs.source_device_label }}
          SOURCE_FULL_KERNEL_VERSION: ${{ inputs.source_full_kernel_version }}
          SOURCE_ANDROID_VERSION: ${{ inputs.source_android_version }}
          SOURCE_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          KERNEL_VERSION_OVERRIDE: ${{ inputs.kernel_version_override }}
        run: bash platform-tools/kernel_build/clean/source.sh sync

      - name: 初始化 Custom source manifest 状态
        if: inputs.source_mode == 'custom_git'
        env:
          SOURCE_MODE: ${{ inputs.source_mode }}
          SOURCE_DEFCONFIGS: ${{ inputs.source_defconfigs }}
          USE_ZRAM: ${{ inputs.use_zram }}
          USE_BBG: ${{ inputs.use_bbg }}
          USE_DDK: ${{ inputs.use_ddk }}
          USE_NTSYNC: ${{ inputs.use_ntsync }}
          USE_NETWORKING: ${{ inputs.use_networking }}
          USE_KPM: ${{ inputs.use_kpm }}
          USE_REKERNEL: ${{ inputs.use_rekernel }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          VIRTUALIZATION_SUPPORT: ${{ inputs.virtualization_support }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
        run: bash platform-tools/kernel_build/clean/source.sh custom-baseline

      - name: 应用 Stock Config 伪装
        if: inputs.source_mode != 'custom_git'
        run: bash platform-tools/kernel_build/clean/prepare.sh stock-config

      - name: 提取实际子版本号
        run: bash platform-tools/kernel_build/clean/prepare.sh actual-sublevel

      - name: 修复 glibc 2.38 兼容性
        run: bash platform-tools/kernel_build/core/glibc-compat.sh glibc

      - name: 添加一加 8E 处理器支持
        if: inputs.supp_op
        run: bash platform-tools/kernel_build/core/oneplus-8e.sh oneplus8e

      - name: 添加 KernelSU
        if: inputs.ksu_variant != 'None'
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: kernelsu
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "KernelSU integration failed"
        run: bash platform-tools/kernel_build/patch/kernelsu.sh install

      - name: 修复 BakaSU SUSFS 源码兼容
        if: inputs.ksu_variant == 'BakaSU' && inputs.enable_susfs
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: susfs
          ABK_FEATURE_FAILURE_MESSAGE: "BakaSU SUSFS compatibility integration failed"
        run: bash platform-tools/kernel_build/patch/susfs_compat.sh bakasu

      - name: 确保 KernelSU SUSFS ABI 兼容
        if: (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'BakaSU') && inputs.enable_susfs
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: kernelsu
          ABK_FEATURE_FAILURE_MESSAGE: "KernelSU SUSFS ABI compatibility integration failed"
        run: bash platform-tools/kernel_build/patch/kernelsu.sh abi

      - name: 配置 SukiSU 管理器信息
        if: inputs.ksu_variant == 'SukiSU'
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: kernelsu
          ABK_FEATURE_FAILURE_MESSAGE: "SukiSU manager version integration failed"
        run: bash platform-tools/kernel_build/patch/kernelsu.sh manager-info

      - name: 应用 SUSFS 补丁
        if: inputs.enable_susfs && inputs.ksu_variant != 'None'
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: susfs
          ABK_FEATURE_END: "false"
          ABK_FEATURE_FAILURE_MESSAGE: "SUSFS patch failed"
          ABK_ANDROID_VERSION: ${{ inputs.android_version }}
          ABK_KERNEL_VERSION: ${{ inputs.kernel_version }}
          ABK_KSU_VARIANT: ${{ inputs.ksu_variant }}
          ABK_SUB_LEVEL: ${{ inputs.sub_level }}
          ABK_OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          ABK_USE_BBG: ${{ inputs.use_bbg }}
        run: bash platform-tools/kernel_build/patch/susfs.sh apply

      - name: 确保 SUSFS Kconfig 与核心对象
        if: inputs.enable_susfs && inputs.ksu_variant != 'None'
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: susfs
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "SUSFS Kconfig integration failed"
        run: bash platform-tools/kernel_build/patch/susfs.sh kconfig

      - name: 注入 SukiSU/BakaSU KPM Kconfig
        if: inputs.use_kpm && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'BakaSU')
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: kpm
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "KPM Kconfig integration failed"
        run: bash platform-tools/kernel_build/patch/kpm.sh kconfig

      - name: 应用 Kernel 特定补丁
        run: bash platform-tools/kernel_build/core/kernel-specific.sh kernel-specific

      - name: 备份基准 defconfig
        run: bash platform-tools/kernel_build/clean/prepare.sh backup-defconfig

      - name: 应用 NTsync 补丁
        if: ${{ inputs.use_ntsync }}
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: ntsync
          ABK_ANDROID_VERSION: ${{ inputs.android_version }}
          ABK_KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: bash platform-tools/kernel_build/patch/ntsync.sh ntsync

      - name: 应用 Networking 增强 (IPSet + BBR)
        if: ${{ inputs.use_networking }}
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: networking
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "Networking enhancement failed"
        run: bash platform-tools/kernel_build/patch/features.sh networking

      - name: 克隆虚拟化支持补丁仓库
        if: inputs.virtualization_support != 'off'
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: virtualization
          ABK_FEATURE_END: "false"
          ABK_FEATURE_FAILURE_MESSAGE: "Virtualization patch download failed"
          ABK_DROIDSPACES_REF: ${{ vars.ABK_DROIDSPACES_REF || '' }}
          ABK_DROIDSPACES_DEFAULT_REF: v7.1.0
        run: bash platform-tools/kernel_build/patch/virtualization.sh clone

      - name: 集成虚拟化支持
        if: inputs.virtualization_support != 'off'
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: virtualization
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "Virtualization integration failed"
        run: bash platform-tools/kernel_build/patch/virtualization.sh apply

      - name: 应用 Unicode 绕过修复
        if: inputs.enable_susfs
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: susfs
          ABK_FEATURE_FAILURE_MESSAGE: "SUSFS Unicode compatibility integration failed"
        run: bash platform-tools/kernel_build/core/unicode.sh unicode

      - name: 配置 ZRAM 补丁栈
        if: ${{ inputs.use_zram }}
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: zram
          ABK_FEATURE_END: "false"
          ABK_FEATURE_FAILURE_MESSAGE: "ZRAM patch stack failed"
        run: bash platform-tools/kernel_build/patch/zram.sh stack

      - name: 修复 6.6 WiFi/蓝牙兼容性（三星 + 小米）
        if: inputs.kernel_version == '6.6'
        run: bash platform-tools/kernel_build/core/wifi-bt-66.sh wifi-bt

      - name: 配置 ZRAM 选项
        if: ${{ inputs.use_zram }}
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: zram
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "ZRAM configuration failed"
        run: bash platform-tools/kernel_build/patch/zram.sh options

      - name: 添加 BBG 防格机补丁
        if: inputs.use_bbg
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: bbg
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "BBG integration failed"
        run: bash platform-tools/kernel_build/patch/features.sh bbg

      - name: 添加 DDK 防格机 LSM
        if: inputs.use_ddk
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: ddk
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "DDK integration failed"
        run: bash platform-tools/kernel_build/patch/features.sh ddk

      - name: 应用 Re-Kernel
        if: inputs.use_rekernel
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: rekernel
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "Re-Kernel integration failed"
        run: bash platform-tools/kernel_build/patch/features.sh rekernel

      - name: 执行自定义外部模块 (after_patch)
        if: inputs.custom_external_modules != ''
        env:
          CUSTOM_EXTERNAL_MODULE_STAGE: after_patch
          ABK_BUILD_ANDROID_VERSION: ${{ inputs.android_version }}
          ABK_BUILD_KERNEL_VERSION: ${{ inputs.kernel_version }}
          ABK_BUILD_SUB_LEVEL: ${{ inputs.sub_level }}
          ABK_BUILD_OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          ABK_BUILD_REVISION: ${{ inputs.revision }}
          ABK_BUILD_KSU_VARIANT: ${{ inputs.ksu_variant }}
          ABK_BUILD_KSU_BRANCH: ${{ inputs.ksu_branch }}
          ABK_BUILD_VERSION: ${{ inputs.version }}
          ABK_BUILD_TIME: ${{ inputs.build_time }}
          ABK_BUILD_VIRTUALIZATION_SUPPORT: ${{ inputs.virtualization_support }}
          ABK_BUILD_ZRAM_EXTRA_ALGOS: ${{ inputs.zram_extra_algos }}
          ABK_FEATURE_USE_ZRAM: ${{ inputs.use_zram }}
          ABK_FEATURE_USE_BBG: ${{ inputs.use_bbg }}
          ABK_FEATURE_USE_DDK: ${{ inputs.use_ddk }}
          ABK_FEATURE_USE_NTSYNC: ${{ inputs.use_ntsync }}
          ABK_FEATURE_USE_NETWORKING: ${{ inputs.use_networking }}
          ABK_FEATURE_USE_KPM: ${{ inputs.use_kpm }}
          ABK_FEATURE_USE_REKERNEL: ${{ inputs.use_rekernel }}
          ABK_FEATURE_ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ABK_FEATURE_SUPP_OP: ${{ inputs.supp_op }}
          ABK_FEATURE_ZRAM_FULL_ALGO: ${{ inputs.zram_full_algo }}
        run: bash platform-tools/kernel_build/patch/custom.sh after-patch

      - name: 配置内核选项
        run: bash platform-tools/kernel_build/patch/kernel_options.sh kernel-options

      - name: 配置 KPM 超级密码
        if: inputs.use_kpm && inputs.kpm_password != '' && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'BakaSU')
        run: bash platform-tools/kernel_build/patch/kpm.sh password

      - name: 添加 SUSFS 配置
        if: inputs.enable_susfs && inputs.ksu_variant != 'None'
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: susfs
          ABK_FEATURE_FAILURE_MESSAGE: "SUSFS defconfig integration failed"
        run: bash platform-tools/kernel_build/patch/susfs.sh config

      - name: 配置内核名称
        run: bash platform-tools/kernel_build/clean/build.sh kernel-name

      - name: 设置自定义构建时间
        shell: bash
        run: bash platform-tools/kernel_build/clean/build.sh build-time

      - name: 执行自定义外部模块 (before_build)
        if: inputs.custom_external_modules != ''
        env:
          CUSTOM_EXTERNAL_MODULE_STAGE: before_build
          ABK_BUILD_ANDROID_VERSION: ${{ inputs.android_version }}
          ABK_BUILD_KERNEL_VERSION: ${{ inputs.kernel_version }}
          ABK_BUILD_SUB_LEVEL: ${{ inputs.sub_level }}
          ABK_BUILD_OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          ABK_BUILD_REVISION: ${{ inputs.revision }}
          ABK_BUILD_KSU_VARIANT: ${{ inputs.ksu_variant }}
          ABK_BUILD_KSU_BRANCH: ${{ inputs.ksu_branch }}
          ABK_BUILD_VERSION: ${{ inputs.version }}
          ABK_BUILD_TIME: ${{ inputs.build_time }}
          ABK_BUILD_VIRTUALIZATION_SUPPORT: ${{ inputs.virtualization_support }}
          ABK_BUILD_ZRAM_EXTRA_ALGOS: ${{ inputs.zram_extra_algos }}
          ABK_FEATURE_USE_ZRAM: ${{ inputs.use_zram }}
          ABK_FEATURE_USE_BBG: ${{ inputs.use_bbg }}
          ABK_FEATURE_USE_DDK: ${{ inputs.use_ddk }}
          ABK_FEATURE_USE_NTSYNC: ${{ inputs.use_ntsync }}
          ABK_FEATURE_USE_NETWORKING: ${{ inputs.use_networking }}
          ABK_FEATURE_USE_KPM: ${{ inputs.use_kpm }}
          ABK_FEATURE_USE_REKERNEL: ${{ inputs.use_rekernel }}
          ABK_FEATURE_ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ABK_FEATURE_SUPP_OP: ${{ inputs.supp_op }}
          ABK_FEATURE_ZRAM_FULL_ALGO: ${{ inputs.zram_full_algo }}
        run: bash platform-tools/kernel_build/patch/custom.sh before-build

      - name: 应用自定义内核选项
        if: inputs.custom_kernel_options != ''
        env:
          CUSTOM_KERNEL_OPTIONS: ${{ inputs.custom_kernel_options }}
        run: bash platform-tools/kernel_build/patch/custom.sh kernel-options-custom

      - name: 修复 Official SUSFS 源码兼容
        if: inputs.ksu_variant == 'Official' && inputs.enable_susfs
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: susfs
          ABK_FEATURE_FAILURE_MESSAGE: "Official SUSFS compatibility integration failed"
        run: bash platform-tools/kernel_build/patch/susfs_compat.sh official

      - name: 修复 Official SUSFS 6.1-6.18 SELinux 导出
        if: inputs.ksu_variant == 'Official' && inputs.enable_susfs && (inputs.kernel_version == '6.1' || inputs.kernel_version == '6.6' || inputs.kernel_version == '6.12' || inputs.kernel_version == '6.18')
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: susfs
          ABK_FEATURE_FAILURE_MESSAGE: "Official SUSFS SELinux export integration failed"
        run: bash platform-tools/kernel_build/patch/susfs_compat.sh selinux-export

      - name: 补齐 SukiSU SUSFS 内联 hook 符号
        if: inputs.ksu_variant == 'SukiSU' && inputs.enable_susfs
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: susfs
          ABK_FEATURE_FAILURE_MESSAGE: "SukiSU SUSFS inline hook integration failed"
        run: bash platform-tools/kernel_build/patch/susfs_compat.sh inline-hooks

      - name: 最终修复 SukiSU/BakaSU 源码兼容
        if: inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'BakaSU'
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: kernelsu
          ABK_FEATURE_FAILURE_MESSAGE: "KernelSU final compatibility integration failed"
        run: bash platform-tools/kernel_build/patch/susfs_compat.sh final

      - name: 修复 SukiSU/BakaSU android16-6.12 / android17-6.18 源码兼容
        if: (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'BakaSU') && ((inputs.android_version == 'android16' && inputs.kernel_version == '6.12') || (inputs.android_version == 'android17' && inputs.kernel_version == '6.18'))
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: kernelsu
          ABK_FEATURE_FAILURE_MESSAGE: "KernelSU android16/android17 compatibility integration failed"
        run: bash platform-tools/kernel_build/patch/susfs_compat.sh a16-612

      - name: 校验 ABK 管理器桥接
        if: inputs.custom_external_modules != '' && inputs.ksu_variant != 'None'
        run: bash platform-tools/kernel_build/patch/custom.sh manager-bridge

      - name: 编译内核
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: bash platform-tools/kernel_build/clean/build.sh compile

      - name: 应用 KPM 补丁 (SukiSU/BakaSU)
        if: inputs.use_kpm && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'BakaSU')
        env:
          BASH_ENV: ${{ inputs.source_mode == 'custom_git' && format('{0}/.github/scripts/custom-source-feature-env.sh', github.workspace) || '' }}
          ABK_FEATURE_ID: kpm
          ABK_FEATURE_END: "true"
          ABK_FEATURE_FAILURE_MESSAGE: "KPM image patch failed and the image was restored"
          KPM_PASSWORD: ${{ inputs.kpm_password }}
        run: bash platform-tools/kernel_build/patch/kpm.sh image

      - name: 准备 Boot 镜像
        run: bash platform-tools/kernel_build/clean/package.sh boot-prep

      - name: 创建 AnyKernel3 压缩包
        run: bash platform-tools/kernel_build/clean/package.sh anykernel

      - name: 构建 Boot 镜像 (Android 12)
        if: inputs.source_mode != 'custom_git' && inputs.android_version == 'android12'
        run: bash platform-tools/kernel_build/clean/package.sh boot-a12

      - name: 构建 Boot 镜像 (Android 13+)
        if: inputs.source_mode != 'custom_git' && (inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' || inputs.android_version == 'android16' || inputs.android_version == 'android17')
        run: bash platform-tools/kernel_build/clean/package.sh boot-a13

      - name: 打包签名内核 Bundle
        env:
          ABK_ARTIFACT_SIGNING_KEY_BASE64: ${{ secrets.ABK_ARTIFACT_SIGNING_KEY_BASE64 }}
        run: bash platform-tools/kernel_build/clean/package.sh bundle

      - name: 收集补丁冲突文件
        if: always()
        run: bash platform-tools/kernel_build/clean/package.sh collect-rejects

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}
          path: |
            *.bundle.zip
            ABK_FLASH_DEPENDENCIES.json
            LICENSE
            THIRD_PARTY_NOTICES.md
          compression-level: 9

      - name: 上传补丁冲突文件
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

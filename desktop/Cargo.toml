[package]
name = "abk-desktop"
version = "0.1.0"
edition = "2021"
default-run = "abk_sidecar"
autobins = false

[[bin]]
name = "abk_sidecar"
path = "src/main.rs"

[[bin]]
name = "abk_launcher"
path = "src/launcher.rs"

[[bin]]
name = "abk-desktop"
path = "src/desktop_entry.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
futures-util = "0.3"
libc = "0.2"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
urlencoding = "2.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
